<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License | Royal Chicken</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            background: #101010;
            color: #d4af37;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin-bottom: 25px;
            font-size: 28px;
        }
        .license-frame {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px;
            background: linear-gradient(135deg, #f7e7a1, #b8860b, #f7e7a1);
            border: 2px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }
        .license-frame img {
            display: block;
            width: 100%;
            height: auto;
            border: 3px solid #171717;
            border-radius: 5px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #d4af37;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 23px;
            }
            .license-frame {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <h1>Royal Chicken — License</h1>
    <div class="license-frame">
        <img src="images/license.jpeg" alt="Royal Chicken License">
    </div>
    <a href="index.html" class="back-btn">Back to Home</a>
</body>
</html>
